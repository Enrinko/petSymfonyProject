apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pet-symphony-allow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pet-symphony
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 5432
    - ports:
        - port: 6379
