apiVersion: v1
kind: ConfigMap
metadata:
  name: pet-symphony-config
data:
  APP_ENV: "prod"
  # Disables Caddy ACME; port 8080 is safe for non-root + no NET_BIND_SERVICE.
  # TLS is terminated at the Ingress controller.
  SERVER_NAME: ":8080"
  REDIS_URL: "redis://redis:6379"
  # TLS терминируется на ingress → доверяем прокси, чтобы X-Forwarded-* были
  # достоверны (клиентский IP в rate-limit/audit, определение Host). Сузьте до
  # реального CIDR подов ingress-контроллера вашего кластера.
  TRUSTED_PROXIES: "10.0.0.0/8"
  # Защита от host header injection в ссылках писем. Пусто = без ограничения.
  # ЗАДАЙТЕ свой домен, напр.: "^(pet-symphony\\.example\\.com)$"
  TRUSTED_HOSTS: ""
  # METRICS_TOKEN держите в Secret pet-symphony-secrets (не в ConfigMap).
