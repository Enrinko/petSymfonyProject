# Базовый каталог (RU). Неймспейсы:
#   layout.*   — shell (сайдбар/топбар) и auth-layout
#   page.*     — страницы: login, register, forgot, reset, verify, profile
#   auth.*     — сообщения API аутентификации (login/register/reset/2fa)
#   frontend.* — словарь React: выгружается в <script data-i18n> целиком (см. FrontendI18nExtension)

layout:
    locale:
        switch: 'Переключить язык (русский / английский)'
    theme:
        toggle: 'Переключить тему'
        title: 'Светлая / тёмная тема'
    sound:
        toggle: 'Звуки интерфейса'
        title: 'Звуки интерфейса (по умолчанию выключены)'
    auth:
        pitch_title: 'CRM, в которой каждый клиент звучит <em>в унисон</em> с вами.'
        pitch_sub: 'Клиенты, заметки и роли команды — партитура вашего бизнеса в одном месте.'
        footer: 'petSymphony · учебный проект на Symfony 8 + React'
    nav:
        aria: 'Основная навигация'
        overview: 'Обзор'
        dashboard: 'Рабочий стол'
        clients: 'Ученики'
        schedule: 'Расписание'
        events: 'Мероприятия'
        orchestra: 'Оркестр'
        projects: 'Проекты'
        admin: 'Администрирование'
        users: 'Пользователи и роли'
        instruments: 'Инструменты'
        audit: 'Журнал безопасности'
        styleguide: 'Стайлгайд'
    user:
        profile: 'Профиль'
        logout: 'Выйти ↗'
    verify:
        banner: 'Подтвердите email: письмо отправлено на <strong>%email%</strong>. Без этого напоминания ученикам могут не доходить.'
        resend: 'Отправить ещё раз'
    topbar:
        search: 'Поиск'
        search_aria: 'Поиск (Ctrl+K)'

# Значения ru дублируют fallback-строки в t()-вызовах — это осознанно:
# fallback держит jsdom-тесты и рассинхрон, каталог — источник переводов
frontend:
    common:
        network_error: 'Сервер недоступен. Проверьте соединение.'
        request_failed: 'Не удалось выполнить запрос.'
    form:
        required: 'Обязательное поле'
        email: 'Некорректный email'
        min_length: 'Минимум %n% символов'
        mismatch: 'Пароли не совпадают'
    auth:
        password_label: 'Пароль'
        password_confirm_label: 'Повторите пароль'
        password_placeholder: 'Минимум 10 символов'
        password_repeat_placeholder: 'Ещё раз'
        login:
            fallback_error: 'Не удалось войти. Попробуйте ещё раз.'
            remember: 'Запомнить меня на 30 дней'
            submitting: 'Входим…'
            submit: 'Войти'
        2fa:
            code_required: 'Введите код из приложения или резервный.'
            fallback_error: 'Не удалось проверить код. Попробуйте ещё раз.'
            prompt: 'Введите шестизначный код из приложения-аутентификатора или один из резервных кодов.'
            code_label: 'Код подтверждения'
            submitting: 'Проверяем…'
            submit: 'Подтвердить'
        register:
            fallback_error: 'Не удалось зарегистрироваться.'
            submitting: 'Создаём аккаунт…'
            submit: 'Создать аккаунт'
        forgot:
            fallback_error: 'Не удалось отправить письмо. Попробуйте ещё раз.'
            sent_title: 'Проверьте почту'
            sent_before: 'Если адрес'
            sent_after: 'зарегистрирован, мы отправили на него письмо со ссылкой для сброса пароля. Ссылка действует 1 час.'
            submitting: 'Отправляем…'
            submit: 'Отправить ссылку'
        reset:
            fallback_error: 'Ошибка сервера. Попробуйте ещё раз.'
            done_title: 'Пароль изменён'
            done_text: 'Перенаправляем на страницу входа…'
            invalid_token: 'Ссылка недействительна или истекла. Запросите новую.'
