framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # cache.app в Redis: общее хранилище для всех инстансов PHP
        # (FrankenPHP worker-режим + будущее масштабирование). Данные
        # переживают деплой и рестарт контейнера.
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

when@test:
    framework:
        cache:
            # Тесты не зависят от Redis (в CI поднимаются только php+database):
            # файловый кэш, как было до подключения Redis. Пул cache.rate_limiter
            # наследует его — очистка в FunctionalTestCase::setUp() работает как раньше.
            app: cache.adapter.filesystem
