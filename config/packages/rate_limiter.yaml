framework:
    rate_limiter:
        # Регистрация: защита от ботов, лимит на IP
        registration_ip:
            policy: 'sliding_window'
            limit: 5
            interval: '60 minutes'
        # Запрос сброса пароля: лимит на IP…
        password_forgot_ip:
            policy: 'sliding_window'
            limit: 10
            interval: '60 minutes'
        # …и отдельный на email — защита адресата от бомбардировки письмами
        password_forgot_email:
            policy: 'sliding_window'
            limit: 3
            interval: '60 minutes'
        # Повторная отправка письма подтверждения — по пользователю
        verify_email_resend:
            policy: 'sliding_window'
            limit: 3
            interval: '60 minutes'

# Хранилище счётчиков — пул cache.rate_limiter поверх cache.app (Redis):
# лимиты глобальные для всех инстансов PHP, а не по-контейнерные.
# В тестах cache.app файловый (см. cache.yaml) — изоляция сохраняется,
# FunctionalTestCase чистит пул в setUp().
# Сброс в dev: bin/console cache:pool:clear cache.rate_limiter

# В тестах пул остаётся файловым, а FunctionalTestCase::setUp() чистит его
# перед каждым тестом: изоляция и между тестами, и между прогонами.
# (Array-адаптер не подходит: services_resetter очищает его в начале каждого
# HTTP-запроса через Kernel::boot, и счётчики никогда не копятся.)
