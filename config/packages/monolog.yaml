monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        # Прикладные каналы: безопасность (логины, роли, деактивации),
        # почта и очередь — фильтруются независимо друг от друга
        - app
        - security
        - mailer
        - messenger

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: php://stderr
                level: debug
                # !doctrine: DEBUG-канал печатает каждый SQL — консоль тонет
                channels: ["!event", "!doctrine"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            # В тестах шумит только реальная проблема: буфер сбрасывается
            # лишь при error+ (ожидаемые 4xx не печатаются)
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [401, 403, 404, 405, 409, 422, 429]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # 12-factor: JSON построчно в stdout, собирает Docker.
            # fingers_crossed: до первого error пишется ничего, при error —
            # весь буфер запроса (полный контекст инцидента)
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stdout
                level: debug
                formatter: monolog.formatter.json
            # Security-канал пишется всегда (не ждёт error): неудачные логины
            # и админ-операции — это рабочий журнал, а не отладка
            security_stream:
                type: stream
                path: php://stdout
                level: info
                channels: [security]
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stdout
                formatter: monolog.formatter.json
