security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Domain\User\User
                property: email

    role_hierarchy:
        ROLE_MODERATOR: ROLE_USER
        ROLE_ADMIN: [ROLE_MODERATOR, ROLE_USER]

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            entry_point: App\Infrastructure\Security\AppAuthenticationEntryPoint
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
                failure_handler: App\Infrastructure\Security\AppAuthenticationFailureHandler
            # Брутфорс-защита: считает попытки по паре IP+email и по IP
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            # «Запомнить меня»: подписанная кука (без таблицы) по флагу
            # _remember_me в JSON-теле логина; смена пароля инвалидирует
            # куку через signature_properties
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 дней
                samesite: lax
                secure: auto
                signature_properties: [password]
            logout:
                path: app_logout
                target: app_login

    # Note: Only the *first* matching rule is applied
    access_control:
        # Главная публична: аноним видит лендинг, авторизованный — «Пульт»
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/password, roles: PUBLIC_ACCESS }
        - { path: ^/(login|register|forgot-password|reset-password), roles: PUBLIC_ACCESS }
        - { path: ^/(healthz|readyz)$, roles: PUBLIC_ACCESS }
        # Админка требует ПОЛНОЙ аутентификации: remember-куки (REMEMBERED)
        # недостаточно — угнанная кука не должна давать управление ролями
        - { path: ^/api/admin, allow_if: "is_granted('ROLE_ADMIN') and is_fully_authenticated()" }
        - { path: ^/admin, allow_if: "is_granted('ROLE_ADMIN') and is_fully_authenticated()" }
        # Смена пароля — тоже только при полной аутентификации (не из remember-куки)
        - { path: ^/api/profile/password, allow_if: "is_granted('ROLE_USER') and is_fully_authenticated()" }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
