# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    # cookie_samesite: lax — первый рубеж CSRF-защиты (вторая линия —
    # ApiCsrfProtectionListener: маркер X-Requested-With + Origin/Sec-Fetch-Site)
    session:
        cookie_samesite: lax
        cookie_secure: auto

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
