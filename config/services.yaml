# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

imports:
    - { resource: projects.yaml }

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # За сколько часов до занятия отправлять напоминание ученику
    app.lesson_reminder_hours: 24

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            # Доменный слой — сущности, enum'ы и исключения, а не сервисы
            - '../src/Domain/'

    # Доменные порты -> инфраструктурные адаптеры
    App\Domain\User\UserRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrineUserRepository'
    App\Domain\Client\ClientRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrineClientRepository'
    App\Domain\Note\NoteRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrineNoteRepository'
    App\Domain\Tag\TagRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrineTagRepository'
    App\Domain\Instrument\InstrumentRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrineInstrumentRepository'
    App\Domain\Lesson\LessonRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrineLessonRepository'
    App\Domain\Repertoire\RepertoirePieceRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrineRepertoirePieceRepository'
    App\Domain\Event\EventRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrineEventRepository'
    App\Domain\PasswordReset\PasswordResetTokenRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrinePasswordResetTokenRepository'
    App\Domain\Shared\TransactionRunnerInterface: '@App\Infrastructure\Doctrine\DoctrineTransactionRunner'
    App\Domain\User\AvatarStorageInterface: '@App\Infrastructure\Avatar\GdAvatarStorage'
    App\Domain\Audit\AuditEventRepositoryInterface: '@App\Infrastructure\Audit\DoctrineAuditEventRepository'
    App\Domain\Audit\AuditLoggerInterface: '@App\Infrastructure\Audit\RequestAwareAuditLogger'

    App\Infrastructure\Avatar\GdAvatarStorage:
        arguments:
            $publicDir: '%kernel.project_dir%/public'
    App\Application\PasswordReset\PasswordResetMailerInterface: '@App\Infrastructure\Mailer\TemplatedPasswordResetMailer'
    App\Application\Lesson\LessonReminderMailerInterface: '@App\Infrastructure\Mailer\TemplatedLessonReminderMailer'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
