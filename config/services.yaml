# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

imports:
    - { resource: projects.yaml }

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # За сколько часов до занятия отправлять напоминание ученику
    app.lesson_reminder_hours: 24
    # Метка последнего успешного бэкапа (пишет docker/backup/backup.sh);
    # смонтирована только в проде — в dev метрики бэкапа просто нет
    app.backup_last_success_file: '/backups/last_success'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            # Доменный слой — сущности, enum'ы и исключения, а не сервисы
            - '../src/Domain/'

    # Доменные порты -> инфраструктурные адаптеры
    App\Domain\User\UserRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrineUserRepository'
    App\Domain\Client\ClientRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrineClientRepository'
    App\Domain\Note\NoteRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrineNoteRepository'
    App\Domain\Tag\TagRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrineTagRepository'
    App\Domain\Instrument\InstrumentRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrineInstrumentRepository'
    App\Domain\Lesson\LessonRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrineLessonRepository'
    App\Domain\Repertoire\RepertoirePieceRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrineRepertoirePieceRepository'
    App\Domain\Event\EventRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrineEventRepository'
    App\Domain\PasswordReset\PasswordResetTokenRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrinePasswordResetTokenRepository'
    App\Domain\Shared\TransactionRunnerInterface: '@App\Infrastructure\Doctrine\DoctrineTransactionRunner'
    App\Domain\User\AvatarStorageInterface: '@App\Infrastructure\Avatar\GdAvatarStorage'
    App\Domain\Audit\AuditEventRepositoryInterface: '@App\Infrastructure\Audit\DoctrineAuditEventRepository'
    # Порт аудита обёрнут метриками: каждое событие журнала — счётчик.
    # Входы/выходы (login.*) идут в обход этого порта — их считает сам
    # SecurityEventsAuditSubscriber (см. его докблок).
    App\Domain\Audit\AuditLoggerInterface: '@App\Infrastructure\Metrics\MetricsAuditLogger'
    App\Infrastructure\Metrics\MetricsAuditLogger:
        arguments:
            $inner: '@App\Infrastructure\Audit\RequestAwareAuditLogger'
    App\Domain\Session\UserSessionRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrineUserSessionRepository'
    App\Domain\Email\EmailTemplateRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrineEmailTemplateRepository'
    App\Domain\User\TotpSecretCipherInterface: '@App\Infrastructure\Security\SodiumTotpSecretCipher'
    App\Domain\User\BackupCodeRepositoryInterface: '@App\Infrastructure\Doctrine\DoctrineBackupCodeRepository'
    App\Domain\Search\SearchIndexInterface: '@App\Infrastructure\Search\ElasticsearchSearchIndex'
    App\Application\Search\SearchIndexQueueInterface: '@App\Infrastructure\Search\MessengerSearchIndexQueue'

    App\Infrastructure\Security\SodiumTotpSecretCipher:
        arguments:
            $base64Key: '%env(TOTP_ENCRYPTION_KEY)%'

    # Секрет TOTP в БД — шифртекст; расшифровка только в момент проверки
    App\Infrastructure\Security\DecryptingTotpAuthenticator:
        decorates: 'scheb_two_factor.security.totp_authenticator'
        arguments:
            $inner: '@.inner'
    App\Domain\Metrics\MetricsInterface: '@App\Infrastructure\Metrics\PrometheusMetrics'

    # Elasticsearch: клиент собирается фабрикой из ELASTICSEARCH_URL.
    # Ленивый — /api/search при упавшем ES не должен падать на wiring,
    # фолбэк на ILIKE срабатывает только на реальном вызове.
    Elastic\Elasticsearch\Client:
        factory: ['App\Infrastructure\Search\ElasticsearchClientFactory', 'fromUrl']
        arguments: ['%env(ELASTICSEARCH_URL)%']
        lazy: true

    # Глобальный поиск: ES с прозрачным фолбэком на ILIKE (warning в лог)
    App\Infrastructure\Search\FallbackSearchProvider:
        arguments:
            $primary: '@App\Infrastructure\Search\ElasticsearchSearchProvider'
            $fallback: '@App\Application\Search\DatabaseSearchProvider'
    App\Application\Search\SearchProviderInterface: '@App\Infrastructure\Search\FallbackSearchProvider'

    # Метрики: Redis-хранилище (worker-режим — процессы делят счётчики)
    Prometheus\Storage\Adapter:
        factory: ['App\Infrastructure\Metrics\MetricsStorageFactory', 'fromRedisUrl']
        arguments: ['%env(REDIS_URL)%']

    Prometheus\CollectorRegistry:
        arguments: ['@Prometheus\Storage\Adapter', false]

    App\Infrastructure\Avatar\GdAvatarStorage:
        arguments:
            $publicDir: '%kernel.project_dir%/public'
    App\Application\PasswordReset\PasswordResetMailerInterface: '@App\Infrastructure\Mailer\TemplatedPasswordResetMailer'
    App\Application\User\VerificationMailerInterface: '@App\Infrastructure\Mailer\TemplatedVerificationMailer'
    App\Application\Lesson\LessonReminderMailerInterface: '@App\Infrastructure\Mailer\TemplatedLessonReminderMailer'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        Prometheus\Storage\InMemory: ~
        Prometheus\Storage\Adapter: '@Prometheus\Storage\InMemory'
        # CI живёт без Elasticsearch — тесты ходят напрямую в ILIKE-движок
        App\Application\Search\SearchProviderInterface: '@App\Application\Search\DatabaseSearchProvider'
