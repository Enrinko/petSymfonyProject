openapi: 3.0.3

info:
  title: PetSymphony CRM API
  description: REST API для управления клиентами, контактами и заметками
  version: 0.1.0

servers:
  - url: https://localhost/api
    description: Dev (FrankenPHP)

tags:
  - name: clients
    description: Управление клиентами
  - name: notes
    description: Заметки по клиентам
  - name: tags
    description: Теги сегментации клиентов

paths:
  /clients:
    get:
      tags: [clients]
      summary: Список клиентов
      description: Обычный пользователь видит только клиентов, которыми владеет; ROLE_MODERATOR и ROLE_ADMIN — всех. Пер-объектные эндпоинты отвечают 404 на чужого клиента.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: search
          in: query
          description: Поиск по имени, email и телефону (подстрока, без регистра)
          schema:
            type: string
        - name: archived
          in: query
          description: true — включить архивных клиентов в выдачу
          schema:
            type: boolean
            default: false
        - name: tags
          in: query
          description: Имена тегов через запятую — фильтр по ИЛИ
          schema:
            type: string
            example: вокал,онлайн
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Client'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
    post:
      tags: [clients]
      summary: Создать клиента
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInput'
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '422':
          $ref: '#/components/responses/ValidationError'

  /clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [clients]
      summary: Получить клиента
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [clients]
      summary: Обновить клиента
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [clients]
      summary: Архивировать клиента (мягкое удаление)
      description: Физически запись не удаляется — проставляется archivedAt, клиент скрывается из списков. Восстановление — PATCH /clients/{id}/restore.
      responses:
        '204':
          description: Архивирован
        '404':
          $ref: '#/components/responses/NotFound'

  /clients/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [clients]
      summary: Восстановить клиента из архива
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '404':
          $ref: '#/components/responses/NotFound'

  /clients/{id}/notes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [notes]
      summary: Заметки клиента (свежие сверху)
      description: Доступ определяется видимостью клиента (см. /clients). Недоступный клиент — 404.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [notes]
      summary: Добавить заметку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '201':
          description: Создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /tags:
    get:
      tags: [tags]
      summary: Все теги со счётчиком использований
      description: Для автодополнения и фильтра. Управление (удаление) — админский API вне этого контракта.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        usageCount:
                          type: integer

  /notes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [notes]
      summary: Редактировать заметку
      description: Разрешено автору в течение 24 часов после создания; администратору — всегда. Иначе 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '403':
          description: Окно редактирования истекло или чужая заметка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [notes]
      summary: Удалить заметку
      description: Те же права, что и у редактирования (автор в окне 24 часов / админ).
      responses:
        '204':
          description: Удалена
        '403':
          description: Окно редактирования истекло или чужая заметка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    Client:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true
        tags:
          type: array
          readOnly: true
          items:
            type: string
          description: Нормализованные имена тегов (lower-case), отсортированы
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        archivedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true

    ClientInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 180
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          maxLength: 32
          nullable: true
        comment:
          type: string
          maxLength: 10000
          nullable: true
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 40
          description: Полный набор тегов клиента; несуществующие создаются автоматически

    Note:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        content:
          type: string
        authorId:
          type: integer
          readOnly: true
        authorEmail:
          type: string
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        manageable:
          type: boolean
          readOnly: true
          description: Может ли текущий пользователь редактировать/удалять (автор в окне 24 ч или админ)

    NoteInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1

    Error:
      description: Единый конверт ошибок API. message есть всегда; errors — карта «поле → сообщение» только у ошибок валидации, иначе null.
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          nullable: true
          additionalProperties:
            type: string

  responses:
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
