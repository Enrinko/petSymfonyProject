---
# Development environment override
services:
  php:
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      MERCURE_EXTRA_DIRECTIVES: demo
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      APP_ENV: "${APP_ENV:-dev}"
      REDIS_URL: "redis://redis:6379"
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
      MAILER_DSN: "smtp://mailer:1025"
      # Подключаем поддоменные reverse-proxy блоки внешних проектов (только dev).
      # Разворачивается в {$CADDY_EXTRA_CONFIG} в frankenphp/Caddyfile; в prod пусто → no-op.
      CADDY_EXTRA_CONFIG: "import /app/frankenphp/projects/*.caddy"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432:5432"
###< doctrine/doctrine-bundle ###

  node:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm run watch"
    tty: true

  # ── Messenger worker: разбирает очередь писем (и будущих сообщений) ─────────
  worker:
    # Тот же образ, что и php: иначе compose собирает ДУБЛЬ под своим тегом
    # (petsymphony-worker), и `build php` его не обновляет — worker отстаёт
    # от php по расширениям (так он остался без gd и redis)
    image: ${IMAGES_PREFIX:-}app-php
    build:
      context: .
      target: frankenphp_dev
    entrypoint: ["php", "bin/console"]
    # async — письма/сообщения; scheduler_default — периодические задачи (напоминания)
    command: ["messenger:consume", "async", "scheduler_default", "--time-limit=3600", "-vv"]
    restart: unless-stopped
    # Наследуемый из Dockerfile healthcheck бьёт в веб-порт, которого у воркера нет
    healthcheck:
      disable: true
    depends_on:
      database:
        condition: service_started
    volumes:
      - ./:/app
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      XDEBUG_MODE: "off"
      MAILER_DSN: "smtp://mailer:1025"
      REDIS_URL: "redis://redis:6379"
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
      # .env в репо указывает БД для запуска с хоста (127.0.0.1) — воркеру,
      # как и php-сервису, нужен адрес внутри сети compose
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=${POSTGRES_CHARSET:-utf8}

  # ── Cache ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Search / Logs ─────────────────────────────────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.13.4
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  kibana:
    image: kibana:8.13.4
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ── API Docs ──────────────────────────────────────────────────────────────────
  swagger-ui:
    image: swaggerapi/swagger-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Mount to a path OUTSIDE the web root: the image entrypoint copies
      # $SWAGGER_JSON into /usr/share/nginx/html, so mounting it there makes
      # `cp` copy the file onto itself and crash-loop the container.
      - ./docs/api/openapi.yaml:/spec/openapi.yaml:ro
    environment:
      SWAGGER_JSON: /spec/openapi.yaml

  # ── Monitoring ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.7.0
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025:8025" # web UI: http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###

volumes:
  node_modules:
  redis_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
