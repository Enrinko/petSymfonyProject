---
# Production environment override
services:
  php:
    build:
      context: .
      target: frankenphp_prod
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # Пользовательские загрузки (аватары) переживают пересборку образа
      - uploads_data:/app/public/uploads
      - backups_data:/backups:ro
    environment:
      APP_SECRET: ${APP_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required in production}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}@redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      # Без явного DSN прод молча отправлял бы письма в null-транспорт из .env
      # (composer dump-env prod фиксирует .env в образе). Падаем при отсутствии.
      MAILER_DSN: ${MAILER_DSN:?MAILER_DSN is required in production (e.g. smtp://user:pass@smtp.example.com:587)}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}

  # Воркер очереди: без него письма остаются лежать в messenger_messages.
  # time-limit=3600 + restart — штатный способ перечитывать код после деплоя.
  worker:
    # Единый образ с php — не собирать дубль под отдельным тегом
    image: ${IMAGES_PREFIX:-}app-php
    build:
      context: .
      target: frankenphp_prod
    entrypoint: ["php", "bin/console"]
    command: ["messenger:consume", "async", "scheduler_default", "--time-limit=3600"]
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      database:
        condition: service_started
    environment:
      APP_SECRET: ${APP_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required in production}
      MAILER_DSN: ${MAILER_DSN:?MAILER_DSN is required in production}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}@redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=${POSTGRES_CHARSET:-utf8}

  # Ежедневные бэкапы БД: pg_dump -Fc с ротацией 7 дневных / 4 недельных /
  # 3 месячных. Проверка восстановимости: sh bin/verify-backup (раз в месяц!).
  # Runbook восстановления: docs/ru-бэкапы.md
  backup:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    entrypoint: ["sh", "/backup.sh"]
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGHOST: database
      PGUSER: ${POSTGRES_USER:-app}
      PGPASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      PGDATABASE: ${POSTGRES_DB:-app}
      APP_GIT_SHA: ${APP_GIT_SHA:-nogit}
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - backups_data:/backups
    healthcheck:
      # Бэкап свежее 48 часов (2 интервала) — иначе unhealthy, заметно снаружи
      test: ["CMD", "sh", "-c", "test -f /backups/last_success && test $$(( $$(date +%s) - $$(date -d \"$$(cat /backups/last_success)\" +%s) )) -lt 172800"]
      interval: 1h
      timeout: 5s
      retries: 3
      start_period: 24h

  # Elasticsearch: движок глобального поиска (индексы clients/notes).
  # Однонодовый режим — сознательно: объёмы музыкальной школы кластера не
  # требуют (docs/ru-поиск.md). Порт наружу не публикуется — только внутренняя
  # сеть; security выключен по той же модели, что и у Redis (изоляция сетью).
  # php от ES НЕ зависит: при недоступном ES поиск прозрачно живёт на ILIKE.
  elasticsearch:
    image: elasticsearch:8.13.4
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Redis: сессии, cache.app, счётчики rate limiter'а.
  # Порт наружу не публикуется — только внутренняя сеть; пароль обязателен.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  uploads_data:
  redis_data:
  backups_data:
  elasticsearch_data:
