global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: dev
    service: pet-symphony

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # Requires a /metrics endpoint in the Symfony app (e.g. promphp/prometheus_client_php).
  # Will show as "down" until the endpoint is implemented — that is expected.
  - job_name: pet-symphony
    metrics_path: /metrics
    static_configs:
      - targets: ['php:80']
