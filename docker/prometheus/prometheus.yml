global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: dev
    service: pet-symphony

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # Symfony-приложение: GET /metrics (см. src/Controller/MetricsController.php)
  - job_name: pet-symphony
    metrics_path: /metrics
    static_configs:
      - targets: ['php:80']
