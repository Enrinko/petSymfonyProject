---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: "compose.yaml:compose.ci.yaml"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      # public/build/ нет в чекауте (в dev его делает node-watcher), а php
      # бинд-монтирует исходники — без сборки ассетов любая HTML-страница
      # падает 500 на entrypoints.json. Шаги повторяют зелёный джоб Frontend;
      # composer install обязан идти до npm ci (@symfony/ux-react — file:-зависимость)
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --no-scripts
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Build frontend assets
        run: npm run build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker images
        uses: docker/bake-action@v6
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.ci.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost
      - name: Check HTTPS reachability
        run: curl -v --insecure --fail-with-body https://localhost
      - name: Check Mercure reachability
        run: curl -vI --insecure --fail-with-body https://localhost/.well-known/mercure?topic=test
      - name: Create test database
        run: docker compose exec -T php bin/console -e test doctrine:database:create
      - name: Run migrations
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      - name: Run PHPUnit
        run: docker compose exec -T php bin/phpunit
      - name: Doctrine Schema Validator
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate
      - name: PHPStan (level 8)
        run: docker compose exec -T php vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Composer audit (CVE в PHP-зависимостях)
        run: docker compose exec -T php composer audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      # composer install обязан идти до npm ci: @symfony/ux-react ставится
      # из vendor/symfony/ux-react/assets (file:-зависимость)
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --no-scripts
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Stylelint
        run: npm run stylelint
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks — detect secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Тег без v-префикса (0.20.0) удалён из репозитория экшена —
      # актуальные релизы тегируются v0.x.y
      - name: trivy — filesystem dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      # v3.1.0 нёс hadolint 2.12, который не знает COPY --exclude
      # (Dockerfile 1.7+); v3.3.0 — hadolint 2.14, парсит чисто
      - name: hadolint — Dockerfile lint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - name: semgrep — SAST (PHP + OWASP Top 10)
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/owasp-top-ten p/php
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint Code Base
        uses: super-linter/super-linter/slim@v8
        env:
          GITHUB_ACTIONS_CONFIG_FILE: actionlint.yaml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_CHECKOV: false
          VALIDATE_TRIVY: false
          # PHP отключён целиком: super-linter гоняет composer install при
          # ЛЮБОМ включённом PHP-валидаторе (включая builtin php -l), а его
          # Alpine-PHP без ext-xml падает FATAL'ом до первого линтера.
          # Синтаксис и качество PHP и так проверяет джоб Tests (PHPStan
          # level 8 внутри настоящего образа приложения)
          VALIDATE_PHP_BUILTIN: false
          VALIDATE_PHP_PHPCS: false
          VALIDATE_PHP_PHPSTAN: false
          VALIDATE_PHP_PSALM: false
